# Probe only, never merged.
name: probe
on:
  push:
    branches: [test/worker-etc-probe]
permissions:
  contents: read
jobs:
  fedora-openssl:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-26.04-arm]
    env:
      IMAGE: fedora:45@sha256:a7d72ba2745b100a3351087472e5ee7b2450af7cf331e7673007e3817612839c
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: >-
          docker run --detach --name distro --volume "$PWD:/src" --workdir /src
          "$IMAGE" tail -f /dev/null
      - run: docker exec distro /bin/sh .github/probe/setup.sh fedora
      - run: >-
          docker exec --user probe --workdir / distro
          bash /src/.github/probe/openssl.sh /opt/target/debug/fsgate-broker
