[workspace]
members = ["crates/fsgate"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/farming-labs/fsgate"

[workspace.lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fsgate_repository_build)"] }
missing_docs = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
