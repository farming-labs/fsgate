[package]
name = "fsgate"
version = "0.1.0"
description = "Filesystem authority as directory handles granted up front, enforced by the kernel."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
cap-std = "4.0.3"
rustix = { version = "1.1.6", features = ["net"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
