[package]
name = "fsgate"
version = "0.1.1"
description = "Filesystem authority as directory handles granted up front, enforced by the kernel."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["sandbox", "landlock", "capabilities", "filesystem", "security"]
categories = ["filesystem", "os::linux-apis"]

[lints]
workspace = true

[dependencies]
cap-std = "4.0.3"
rustix = { version = "1.1.6", features = ["net"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Safe `kill` and `tcgetattr` for the RFC 0006 locked-child tests.
rustix = { version = "1.1.6", features = ["process", "termios"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
libc = { version = "0.2.191", optional = true }
rustix-linux-procfs = { version = "0.1.1", optional = true }

[features]
# Experimental and Linux only: the RFC 0004 interception profile, meaning
# `Gate::open_regular_strict`, `Gate::open_intercepted`, and, on x86_64, the
# `intercept::Launch` launcher. Not covered by semver; it may change or
# disappear in any release.
experimental-intercept = ["rustix/event", "rustix/fs", "dep:libc", "dep:rustix-linux-procfs"]
