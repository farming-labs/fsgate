[package]
name = "fsgate"
version = "0.3.0"
description = "Filesystem authority as directory handles granted up front, enforced by the kernel."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["sandbox", "landlock", "capabilities", "filesystem", "security"]
categories = ["filesystem", "os::linux-apis"]

[lints]
workspace = true

[dependencies]
cap-std = "4.0.3"
rustix = { version = "1.1.6", features = ["fs", "net", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
tempfile = "3.27.0"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Safe `kill` and `tcgetattr` for the RFC 0006 locked-child tests.
rustix = { version = "1.1.6", features = ["process", "termios"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
# `close_range` for the worker `fsgate-broker` confines (RFC 0008).
libc = "0.2.191"
rustix-linux-procfs = { version = "0.1.1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# `getpeereid`, which `rustix` does not wrap (RFC 0007).
libc = "0.2.191"

[features]
# Experimental and Linux only: the RFC 0004 interception profile, meaning
# `Gate::open_regular_strict`, `Gate::open_intercepted`, and, on x86_64, the
# `intercept::Launch` launcher. Not covered by semver; it may change or
# disappear in any release. It builds only from the repository, whose
# `.cargo/config.toml` allows it; the published crate refuses it.
experimental-intercept = ["rustix/event", "rustix/fs", "dep:rustix-linux-procfs"]
