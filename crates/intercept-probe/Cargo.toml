[package]
name = "intercept-probe"
version = "0.0.0"
description = "Disposable Linux probe for RFC 0004: seccomp notifications, supervisor memory access, and atomic descriptor delivery."
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
fsgate = { path = "../fsgate", features = ["experimental-intercept"] }
libc = "0.2.191"
rustix = { version = "1.1.6", features = ["event", "fs", "net"] }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dev-dependencies]
tempfile = "3.27.0"
